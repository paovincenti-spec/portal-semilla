<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rich Arcano</title>
</head>
<body>
    <h1>Rich Arcano</h1>
    <div id="arcano-container">
        <!-- Loop through rich arcanos 0 to 22 -->
        {{#each arcanos}}
        <div class="arcano">
            <img src="images/arcano-{{this.index}}.svg" alt="Arcano {{this.index}}">
            <h2>{{this.description}}</h2>
            <p>7-Day Plan: {{this.plan}}</p>
            <p>Affirmation: {{this.affirmation}}</p>
            <textarea placeholder="Journaling..."></textarea>
        </div>
        {{/each}}
    </div>
</body>
</html>
